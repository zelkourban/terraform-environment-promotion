name: _terraform-apply

# Reusable apply job, called by terraform-deploy.yml so the three promotion
# stages cannot drift apart.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-central-1
  PROJECT: acme

jobs:
  apply:
    runs-on: ubuntu-latest

    # Approval gate and credentials both hang off this.
    environment:
      name: ${{ inputs.environment }}

    # Two applies must never touch one state file concurrently.
    concurrency:
      group: apply-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Record trigger
        run: |
          {
            echo "### Applying \`${{ inputs.environment }}\`"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- actor: @${{ github.actor }}"
            echo "- trigger: ${{ github.event_name }}"
            if [ -n "${{ github.event.inputs.reason }}" ]; then
              echo "- out-of-band reason: ${{ github.event.inputs.reason }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-terraform-${{ inputs.environment }}-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-apply-${{ inputs.environment }}-${{ github.run_id }}

      - name: Verify target account
        run: aws sts get-caller-identity

      # The account ID is not committed. It arrives as an environment secret,
      # which also names the state bucket.
      - name: terraform init
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate-${{ inputs.environment }}-${ACCOUNT_ID}"

      - name: terraform plan
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: terraform plan -input=false -no-color -out=tfplan

      # The saved plan, not a fresh one - nothing can appear between approval
      # and apply.
      - name: terraform apply
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: terraform apply -input=false -no-color tfplan

      - name: Outputs
        run: terraform output -no-color
