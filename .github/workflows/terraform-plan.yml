name: terraform-plan

# Plans every environment the PR affects. Never applies - the role is read-only.
# Starts on all PRs, not only Terraform ones: branch protection requires
# `plan-gate`, and a required check that never reports blocks merges forever.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC
  pull-requests: write   # plan comment

concurrency:
  group: plan-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-central-1
  PROJECT: acme

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive

      - uses: aquasecurity/setup-trivy@v0.3.1

      # Run the binary rather than a scan action, so the step's exit code is
      # bash's with nothing in between to swallow it. Accepted findings and
      # the reasons for accepting them live in .trivyignore.yaml.
      - name: trivy config
        run: |
          trivy config . \
            --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL \
            --exit-code 1

  changes:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            shared:
              - 'modules/**'
              - '.github/workflows/terraform-*.yml'
              - '.github/workflows/_terraform-apply.yml'
            dev:
              - 'envs/dev/**'
            staging:
              - 'envs/staging/**'
            prod:
              - 'envs/prod/**'

      - id: select
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          DEV: ${{ steps.filter.outputs.dev }}
          STAGING: ${{ steps.filter.outputs.staging }}
          PROD: ${{ steps.filter.outputs.prod }}
        run: |
          set -euo pipefail

          # Shared changes hit all three - clean in dev can still wreck prod.
          if [ "$SHARED" = "true" ]; then
            envs='["dev","staging","prod"]'
          else
            selected=()
            if [ "$DEV" = "true" ]; then selected+=('"dev"'); fi
            if [ "$STAGING" = "true" ]; then selected+=('"staging"'); fi
            if [ "$PROD" = "true" ]; then selected+=('"prod"'); fi
            envs="[$(IFS=,; echo "${selected[*]-}")]"
          fi

          echo "planning: $envs"
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  plan:
    needs: [validate, changes]
    if: needs.changes.outputs.environments != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.environments) }}

    # `<env>-plan` carries the read-only role and no required reviewers.
    environment: ${{ matrix.environment }}-plan

    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-terraform-${{ matrix.environment }}-plan
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: terraform init
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate-${{ matrix.environment }}-${ACCOUNT_ID}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform plan -input=false -no-color -lock=false \
            -out=tfplan | tee plan.txt
        continue-on-error: true

      # Secrets are masked in logs but not in what we post through the API.
      - name: Redact account ID from plan
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: sed -i "s/${ACCOUNT_ID}/ACCOUNT_ID_REDACTED/g" plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            let plan = fs.readFileSync('envs/' + env + '/plan.txt', 'utf8');
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n... truncated, see the job log.';
            }
            const marker = `<!-- tf-plan:${env} -->`;
            const body = [
              marker,
              `### Terraform plan - \`${env}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Replace the previous comment for this env instead of stacking.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Always-reporting context for branch protection: the plan matrix may be
  # empty, and per-entry contexts like `plan (dev)` would deadlock docs PRs.
  plan-gate:
    needs: [validate, changes, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          echo "validate: ${{ needs.validate.result }}"
          echo "changes:  ${{ needs.changes.result }}"
          echo "plan:     ${{ needs.plan.result }}"

          # 'skipped' is a pass: it means this PR touched no Terraform.
          for r in "${{ needs.validate.result }}" \
                   "${{ needs.changes.result }}" \
                   "${{ needs.plan.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::upstream job result: $r"; exit 1 ;;
            esac
          done
