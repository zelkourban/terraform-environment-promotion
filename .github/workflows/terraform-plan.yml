name: terraform-plan

# Plans each environment whose files the PR touches, plus all three when a
# shared module changes. Never applies anything - the role it assumes is
# read-only.
#
# The workflow starts on every PR, not just Terraform ones: branch protection
# requires the `plan-gate` context, and a required check that never reports
# blocks the merge permanently. Which environments actually get planned is
# decided by the `changes` job below.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC
  pull-requests: write   # plan comment

concurrency:
  group: plan-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-central-1
  PROJECT: acme

jobs:
  # ------------------------------------------------------------------
  # Static checks run once for the whole repo - cheap, fail fast.
  # ------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false

  # ------------------------------------------------------------------
  # Decide which environments need a plan.
  # A change under modules/ fans out to all three.
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            shared:
              - 'modules/**'
              - '.github/workflows/terraform-*.yml'
              - '.github/workflows/_terraform-apply.yml'
            dev:
              - 'envs/dev/**'
            staging:
              - 'envs/staging/**'
            prod:
              - 'envs/prod/**'

      - id: select
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          DEV: ${{ steps.filter.outputs.dev }}
          STAGING: ${{ steps.filter.outputs.staging }}
          PROD: ${{ steps.filter.outputs.prod }}
        run: |
          set -euo pipefail

          # A module or workflow change lands in all three environments, so it
          # has to be planned against all three - a diff that is clean in dev
          # can still be destructive in prod.
          if [ "$SHARED" = "true" ]; then
            envs='["dev","staging","prod"]'
          else
            selected=()
            if [ "$DEV" = "true" ]; then selected+=('"dev"'); fi
            if [ "$STAGING" = "true" ]; then selected+=('"staging"'); fi
            if [ "$PROD" = "true" ]; then selected+=('"prod"'); fi
            envs="[$(IFS=,; echo "${selected[*]-}")]"
          fi

          echo "planning: $envs"
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  plan:
    needs: [validate, changes]
    if: needs.changes.outputs.environments != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.environments) }}

    # Plans against the real state, so it needs the environment's read-only
    # role. GitHub Environment `<env>-plan` carries no required reviewers.
    environment: ${{ matrix.environment }}-plan

    defaults:
      run:
        working-directory: envs/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-terraform-${{ matrix.environment }}-plan
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: terraform init
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate-${{ matrix.environment }}-${ACCOUNT_ID}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform plan -input=false -no-color -lock=false \
            -out=tfplan | tee plan.txt
        continue-on-error: true

      # GitHub masks secrets in job logs, but not in content we post through
      # the API. The plan is full of ARNs and bucket names carrying the
      # account ID, so scrub it before it reaches a public pull request.
      - name: Redact account ID from plan
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: sed -i "s/${ACCOUNT_ID}/ACCOUNT_ID_REDACTED/g" plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            let plan = fs.readFileSync('envs/' + env + '/plan.txt', 'utf8');
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n... truncated, see the job log.';
            }
            const marker = `<!-- tf-plan:${env} -->`;
            const body = [
              marker,
              `### Terraform plan - \`${env}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Replace the previous comment for this env instead of stacking.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ------------------------------------------------------------------
  # Single always-reporting context for branch protection.
  #
  # `plan` is a matrix that may be empty (a docs-only PR plans nothing), and
  # matrix jobs produce one context per entry - so `plan (dev)` cannot be
  # required directly without deadlocking PRs that do not touch dev.
  # ------------------------------------------------------------------
  plan-gate:
    needs: [validate, changes, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          echo "validate: ${{ needs.validate.result }}"
          echo "changes:  ${{ needs.changes.result }}"
          echo "plan:     ${{ needs.plan.result }}"

          # 'skipped' is a pass: it means this PR touched no Terraform.
          for r in "${{ needs.validate.result }}" \
                   "${{ needs.changes.result }}" \
                   "${{ needs.plan.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::upstream job result: $r"; exit 1 ;;
            esac
          done
