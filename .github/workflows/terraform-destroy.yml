name: terraform-destroy

# Manual, dev and staging only. Prod is absent on purpose - tearing it down
# needs a human working locally against a versioned bucket. The friction is
# the control. Typing the name is required; a dropdown is one misclick away.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, staging]
      confirm:
        description: Type the environment name exactly to confirm
        required: true
        type: string
      reason:
        description: Why this environment is being torn down
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-central-1
  PROJECT: acme

jobs:
  destroy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: apply-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}

    steps:
      - name: Verify confirmation
        if: inputs.confirm != inputs.environment
        run: |
          echo "Confirmation '${{ inputs.confirm }}' does not match" \
               "'${{ inputs.environment }}'. Refusing."
          exit 1

      - uses: actions/checkout@v4

      - name: Record trigger
        run: |
          {
            echo "### Destroying \`${{ inputs.environment }}\`"
            echo ""
            echo "- actor: @${{ github.actor }}"
            echo "- reason: ${{ inputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-terraform-${{ inputs.environment }}-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-destroy-${{ inputs.environment }}-${{ github.run_id }}

      - name: terraform init
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${PROJECT}-tfstate-${{ inputs.environment }}-${ACCOUNT_ID}"

      - name: Plan the destroy
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: terraform plan -destroy -input=false -no-color -out=tfplan

      - name: terraform destroy
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: terraform apply -input=false -no-color tfplan

      # Anything still tagged after a destroy is an orphan, usually the
      # residue of a cancelled apply.
      - name: Check for orphans
        run: |
          aws resourcegroupstaggingapi get-resources \
            --tag-filters "Key=Project,Values=${PROJECT}" \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text | tee orphans.txt
          if [ -s orphans.txt ]; then
            echo "::warning::Tagged resources remain after destroy - see above."
          fi
